image: node:18.13.0

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/
    - .pnpm-store/

before_script:
  - npm install -g pnpm@8

build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - dist/

pages:
  stage: deploy
  script:
    - mv dist public/
  artifacts:
    paths:
      - public/
  only:
    - master
